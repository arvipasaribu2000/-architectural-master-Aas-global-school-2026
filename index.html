<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--navy:#0b2a4a;--sea:#1f78a8;--mist:#e8f1f6;--green:#2e8b57;--leaf:#cfe8d5;--warm:#d9893b;--ink:#17212b;--grey:#6b7785;
--sd:#f2c14e;--smp:#4fa3c7;--sma:#2a5d9f;--com:#d9893b;--adm:#8e6bbf;--sport:#7bbf7b;--svc:#9aa3ab;--blue:#58b7e0}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:#cfd8df}
#ui{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--navy);color:#fff;padding:14px;overflow:auto;font-size:13px}
#ui h1{font-size:14px;margin:0 0 4px;letter-spacing:.06em}#ui small{color:#9fc3d9}
#ui button{background:var(--sea);color:#fff;border:0;padding:7px 10px;margin:3px 3px 3px 0;border-radius:4px;cursor:pointer;font-size:12px}
#ui button:hover{background:#2b92c9}#ui ol{padding-left:22px;margin:10px 0}
#ui li{margin:3px 0;color:#7d9bb0}#ui li a{color:#fff;text-decoration:none;cursor:pointer}#ui li a:hover{text-decoration:underline}
#ui li.cur a{color:var(--sd);font-weight:700}
#stage{margin-left:250px;padding:16px;display:flex;justify-content:center}
.sheet{width:420mm;height:297mm;background:#fff;position:relative;overflow:hidden;display:none;padding:14mm 16mm;box-shadow:0 4px 18px #0004;flex-direction:column}
.sheet.active{display:flex}
.hd{display:flex;align-items:baseline;gap:10mm;border-bottom:1.2mm solid var(--navy);padding-bottom:3mm;margin-bottom:5mm}
.hd .no{font-size:34pt;font-weight:800;color:var(--sea)}.hd h2{margin:0;font-size:24pt;color:var(--navy)}.hd .sub{margin-left:auto;font-size:11pt;color:var(--grey)}
.ft{position:absolute;left:16mm;right:16mm;bottom:7mm;display:flex;justify-content:space-between;font-size:9pt;color:var(--grey);border-top:.3mm solid #bbb;padding-top:2mm}
.body{flex:1;display:grid;gap:6mm;min-height:0;padding-bottom:9mm}
.card{border:.3mm solid #c5d3dc;border-radius:2mm;padding:4mm;background:#fff;min-height:0;overflow:hidden}
.card h3{margin:0 0 2mm;font-size:13pt;color:var(--navy)}.card p,.card li{font-size:11pt;line-height:1.4;margin:0 0 2mm}
.card ul{padding-left:5mm;margin:0}svg{width:100%;height:100%;display:block}
.tag{display:inline-block;font-size:9pt;font-weight:700;padding:.4mm 2mm;border-radius:1mm;background:#fff3d6;color:#8a5a00;border:.3mm solid #e8c470;margin-right:2mm}
.lg{display:flex;flex-wrap:wrap;gap:2mm 5mm;font-size:10pt;margin-top:2mm}.lg i{display:inline-block;width:4mm;height:4mm;margin-right:1.5mm;vertical-align:-1mm;border:.2mm solid #0006}
.v3d{position:relative;border:.3mm solid #9fb6c6;border-radius:2mm;overflow:hidden;margin:0 0 2mm}.v3d svg{display:block;width:100%;height:100%}.v3d .cap{position:absolute;left:3mm;top:2mm;z-index:2;background:#ffffffe6;padding:.6mm 2.5mm;font-size:10pt;font-weight:700;color:#0b2a4a;border-radius:1mm}.sheet:has(.v3d) .body{padding-bottom:3mm}.sheet:has(.v3d) table{font-size:6.3pt!important}
.fill3d svg{display:block;width:100%;height:100%}.fill3d .cap{position:absolute;left:2mm;top:1.5mm;z-index:2;background:#ffffffe6;padding:.4mm 2mm;font-size:8.5pt;font-weight:700;color:#0b2a4a;border-radius:1mm}
@page{size:420mm 594mm;margin:0}
@media print{#ui{display:none}body{background:#fff}#stage{margin:0;padding:0;display:block}
.sheet{display:flex!important;box-shadow:none;break-after:auto;page-break-after:auto;page-break-inside:avoid;zoom:1!important}.sheet:nth-child(even){break-after:page;page-break-after:always}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<nav id="ui"><h1>LONTARA HARMONY</h1><small>AAS Global School 2026 · Makassar</small><br><br>

<button onclick="go(0)">Daftar Isi</button><button onclick="window.print()">Print / PDF</button><button onclick="toggleA2()">Mode A2 Portrait</button>

<script>
/* ===== DATA TERPUSAT (sumber konsistensi) ===== */
const PROJECT={name:'AAS GLOBAL SCHOOL 2026',city:'Makassar, South Sulawesi, Indonesia',concept:'LONTARA HARMONY',
tag:'THINK GLOBAL. DESIGN INCLUSIVE. BUILD SUSTAINABLE.',status:'Conceptual Architectural Design — Not to Scale',code:'XXX-XXX'};
const ZONES=[ /* x,y,w,h dalam viewBox 1000x620 (konseptual, bukan ukuran tapak) */
{id:'SD',n:'SD Cluster',c:'--sd',x:70,y:330,w:230,h:150,fl:2},
{id:'SMP',n:'SMP Cluster',c:'--smp',x:70,y:110,w:230,h:150,fl:3},
{id:'SMA',n:'SMA Cluster',c:'--sma',x:700,y:110,w:230,h:170,fl:3},
{id:'LIB',n:'Library & Learning Commons',c:'--com',x:410,y:300,w:180,h:90,fl:2},
{id:'STEAM',n:'STEAM Innovation Hub',c:'--com',x:410,y:150,w:180,h:90,fl:2},
{id:'AUD',n:'Auditorium / Multipurpose',c:'--com',x:700,y:330,w:150,h:90,fl:1},
{id:'ADM',n:'Admin & Welcome',c:'--adm',x:410,y:450,w:180,h:80,fl:2},
{id:'CAN',n:'Kantin & Dapur',c:'--com',x:340,y:330,w:50,h:90,fl:1},
{id:'CLN',n:'Klinik & Mushola',c:'--adm',x:610,y:330,w:70,h:90,fl:1},
{id:'SPT',n:'Sports Hall & Lapangan',c:'--sport',x:700,y:445,w:230,h:90,fl:1},
{id:'SVC',n:'Servis & Utilitas',c:'--svc',x:880,y:550,w:90,h:45,fl:1}];
const PLANNED=['Architectural Cover','Design Vision & Concept','Site Analysis','Master Plan','Zoning, Circulation & Safety','Massing Development','Site Plan & Landscape','SD','SMP','SMA','Common Facilities','Denah SD','Denah SMP','Denah SMA','Tampak Bangunan','Potongan & Roof Plan','Axonometric & Detail','Ruang Kelas Fleksibel & Lab','Quiet Room, Library, Art/Music','Future Classroom & Teknologi','Desain Inklusif','Arsitektur Tropis','Perspektif & Visualisasi','Narasi Desain & QC','Visual Harapan'];
const $=(s)=>document.querySelector(s);
const sheet=(no,title,sub,inner,gridStyle)=>`<section class="sheet"><header class="hd"><span class="no">${String(no).padStart(2,'0')}</span><h2>${title}</h2><span class="sub">${sub||''}</span></header><div class="body" style="${gridStyle||''}">${inner}</div>${typeof strip3d==='function'?strip3d(no):''}<footer class="ft"><span>${PROJECT.name} · ${PROJECT.concept}</span><span>${PROJECT.status} · Kode: ${PROJECT.code}</span><span>Lembar ${no} / ${PLANNED.length}</span></footer></section>`;
const legend=()=>`<div class="lg">`+[['--sd','SD'],['--smp','SMP'],['--sma','SMA'],['--com','Fasilitas bersama'],['--adm','Admin/Kesehatan'],['--sport','Olahraga'],['--svc','Servis']].map(a=>`<span><i style="background:var(${a[0]})"></i>${a[1]}</span>`).join('')+`</div>`;
const zoneSvg=(z)=>`<g><rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="4" fill="var(${z.c})" fill-opacity=".85" stroke="#0b2a4a" stroke-width="2"/><text x="${z.x+z.w/2}" y="${z.y+z.h/2}" text-anchor="middle" font-size="${z.w<100?10:13}" font-weight="700" fill="#fff" style="paint-order:stroke" stroke="#0b2a4a" stroke-width="2.5">${z.id}</text><text x="${z.x+z.w/2}" y="${z.y+z.h/2+15}" text-anchor="middle" font-size="9" fill="#fff" stroke="#0b2a4a" stroke-width="2" style="paint-order:stroke">${z.fl} lt</text></g>`;
const north=(x,y)=>`<g transform="translate(${x},${y})"><circle r="22" fill="#fff" stroke="#0b2a4a" stroke-width="2"/><path d="M0-18 L7 6 L0 1 L-7 6Z" fill="#0b2a4a"/><text y="-26" text-anchor="middle" font-size="13" font-weight="700" fill="#0b2a4a">U</text></g>`;

/* ===== LEMBAR ===== */
const PAGES=[];
PAGES.push(()=>sheet(1,'Architectural Cover','Conceptual Architectural Design',`
<div class="card" style="background:linear-gradient(160deg,#0b2a4a,#1f78a8);color:#fff;border:0;display:grid;grid-template-columns:1.1fr 1.6fr;gap:8mm">
<div style="display:flex;flex-direction:column;justify-content:center">
<div style="font-size:12pt;letter-spacing:.3em;color:#9fd3ee">SAYEMBARA DESAIN ARSITEKTUR</div>
<div style="font-size:46pt;font-weight:800;line-height:1.05;margin:6mm 0 2mm">AAS GLOBAL SCHOOL 2026</div>
<div style="font-size:15pt">${PROJECT.city}</div>
<div style="font-size:38pt;font-weight:300;color:var(--sd);margin:10mm 0 1mm">LONTARA HARMONY</div>
<div style="font-size:14pt;font-style:italic">A Living Archipelago of Knowledge</div>
<div style="font-size:13pt;font-weight:700;margin-top:8mm;letter-spacing:.08em">${PROJECT.tag}</div>
<p style="font-size:13pt;line-height:1.5;margin-top:8mm;color:#dcebf4">Kampus belajar tropis inklusif yang merangkai tiga jenjang, SD, SMP, dan SMA, menjadi satu jaringan komunitas belajar yang aman, teduh, dan terhubung dengan identitas Sulawesi Selatan.</p>
<p style="margin-top:6mm"><span class="tag">STATUS</span><span style="font-size:11pt">Conceptual Architectural Design · ilustrasi vektor, bukan render fotorealistis</span></p></div>
<div style="background:#fff;border-radius:3mm;padding:3mm"><svg viewBox="0 0 1000 620">
<rect width="1000" height="620" fill="#eef6f1"/>
<path d="M500 0 C440 140 560 260 500 400 S470 560 500 620" stroke="#58b7e0" stroke-width="30" fill="none" opacity=".55"/>
${ZONES.map(zoneSvg).join('')}
<text x="20" y="605" font-size="12" fill="#17212b">Ilustrasi diagram kawasan — Conceptual, Not to Scale</text></svg></div></div>`,'grid-template-columns:1fr'));

PAGES.push(()=>sheet(2,'Design Vision & Concept Philosophy','Dari pengetahuan lokal ke ekosistem belajar inklusif',`
<div class="card"><h3>Tantangan &amp; Latar Belakang</h3><p>Sekolah masa depan harus menjawab tiga tekanan sekaligus: iklim tropis panas-lembap dengan hujan intens, keragaman cara belajar siswa (termasuk pengguna kursi roda dan siswa neurodiverse), serta tuntutan standar pendidikan global tanpa tercerabut dari budaya lokal.</p>
<p>Lontara Harmony menjawabnya dengan satu strategi: kawasan sebagai <b>jaringan klaster belajar</b> yang teduh, mudah dibaca, dan dapat dipilih lingkungannya oleh tiap siswa.</p>
<h3>Yang membedakan dari sekolah konvensional</h3><ul><li>Klaster per jenjang, bukan satu blok kelas panjang.</li><li>Pilihan ruang: fokus, kolaboratif, dan tenang.</li><li>Iklim dan air hujan menjadi bagian dari pembelajaran.</li><li>Alur kendaraan dipisah tegas dari alur anak.</li></ul></div>
<div class="card"><h3>Empat Pilar Konsep</h3><svg viewBox="0 0 600 420">
${[['LONTARA','Knowledge & Identity','ritme modul, pola fasad','--sma',150,110],['MARITIME','Connection','jaringan ruang, spine biru','--sea',450,110],['TROPICAL','Harmony','atap, angin, air, vegetasi','--green',150,300],['INCLUSIVE','Learning','akses setara, pilihan sensorik','--warm',450,300]].map(a=>`<circle cx="${a[4]}" cy="${a[5]}" r="95" fill="var(${a[3]})" opacity=".9"/><text x="${a[4]}" y="${a[5]-6}" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">${a[0]}</text><text x="${a[4]}" y="${a[5]+14}" text-anchor="middle" fill="#fff" font-size="13">${a[1]}</text><text x="${a[4]}" y="${a[5]+34}" text-anchor="middle" fill="#fff" font-size="11">${a[2]}</text>`).join('')}
<circle cx="300" cy="210" r="42" fill="#fff" stroke="#0b2a4a" stroke-width="3"/><text x="300" y="206" text-anchor="middle" font-size="12" font-weight="800" fill="#0b2a4a">LONTARA</text><text x="300" y="222" text-anchor="middle" font-size="12" font-weight="800" fill="#0b2a4a">HARMONY</text></svg>
<p style="font-size:9.5pt;color:var(--grey)">Aksara Lontara tidak disalin sebagai ornamen. Yang diterjemahkan adalah logika modul dan ritme: unit berulang yang membentuk modul kelas, kisi peneduh, dan irama selasar.</p></div>
<div class="card" style="grid-column:1/-1"><h3>Diagram Transformasi Konsep</h3><svg viewBox="0 0 1300 150">
${['Local Knowledge|modul & ritme Lontara','Connected Learning Communities|klaster SD–SMP–SMA + hub bersama','Climate-Responsive Architecture|atap berlapis, secondary skin, ventilasi silang','Inclusive Learning Ecosystem|jalur kontinu, ruang tenang, wayfinding'].map((t,i)=>{const [a,b]=t.split('|');return `<rect x="${10+i*325}" y="20" width="285" height="110" rx="8" fill="${['#2a5d9f','#1f78a8','#2e8b57','#d9893b'][i]}"/><text x="${152+i*325}" y="68" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">${a.length>26?a.slice(0,a.indexOf(' ',16)):a}</text><text x="${152+i*325}" y="90" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">${a.length>26?a.slice(a.indexOf(' ',16)+1):''}</text><text x="${152+i*325}" y="115" text-anchor="middle" fill="#fff" font-size="12">${b}</text>${i<3?`<path d="M${297+i*325} 75 l22 0 m-8 -8 l8 8 l-8 8" stroke="#0b2a4a" stroke-width="3" fill="none"/>`:''}`}).join('')}</svg>
<div class="lg"><span><i style="background:#fff"></i>Palet warna: putih, biru laut, biru tua, hijau tropis, aksen hangat terbatas</span><span>Palet material konseptual: beton ekspos halus, kayu/kisi bambu laminasi, atap logam berlapis, batu andesit lokal [ASUMSI KONSEPTUAL]</span></div></div>`,'grid-template-columns:1fr 1fr;grid-template-rows:1fr 210px'));

PAGES.push(()=>sheet(3,'Site Analysis & Environmental Response','Hipotesis iklim Makassar — wajib diuji pada tapak aktual',`
<div class="card"><svg viewBox="0 0 1000 620"><rect width="1000" height="620" fill="#f4f8f5"/>
<rect x="150" y="110" width="700" height="400" fill="#fff" stroke="#0b2a4a" stroke-width="3" stroke-dasharray="14 8"/>
<text x="500" y="320" text-anchor="middle" font-size="16" fill="#6b7785">Batas tapak: BELUM TERSEDIA [PERLU VERIFIKASI TAPAK]</text>
<rect x="0" y="545" width="1000" height="45" fill="#9aa3ab"/><text x="500" y="573" text-anchor="middle" fill="#fff" font-size="14">Jalan akses (asumsi: sisi selatan)</text>
<path d="M60 70 Q500 -10 940 70" stroke="#e8a317" stroke-width="5" fill="none"/>
<circle cx="90" cy="68" r="14" fill="#e8a317"/><text x="90" y="40" font-size="13" fill="#8a5a00" text-anchor="middle">Matahari timur</text>
<circle cx="910" cy="68" r="14" fill="#d9893b"/><text x="910" y="40" font-size="13" fill="#8a5a00" text-anchor="middle">Matahari barat</text>
<rect x="150" y="110" width="40" height="400" fill="#d9893b" opacity=".35"/><rect x="810" y="110" width="40" height="400" fill="#d9893b" opacity=".35"/>
<text x="170" y="150" font-size="12" fill="#8a5a00" transform="rotate(-90 170 300)" text-anchor="middle" >Fasad timur: peneduh vertikal</text>
<text x="830" y="150" font-size="12" fill="#8a5a00" transform="rotate(90 830 300)" text-anchor="middle">Fasad barat: dibuat paling tertutup</text>
${[[880,480,700,330],[880,430,720,300]].map(a=>`<path d="M${a[0]} ${a[1]} L${a[2]} ${a[3]}" stroke="#1f78a8" stroke-width="6" marker-end="url(#ar)"/>`).join('')}
${[[130,130,330,230],[130,180,320,270]].map(a=>`<path d="M${a[0]} ${a[1]} L${a[2]} ${a[3]}" stroke="#58b7e0" stroke-width="6" stroke-dasharray="10 6" marker-end="url(#ar)"/>`).join('')}
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1f78a8"/></marker></defs>
<text x="905" y="520" font-size="12" fill="#1f78a8" text-anchor="end">Angin musim timur (Jun–Agu), umumnya dari tenggara</text>
<text x="60" y="108" font-size="12" fill="#2a7fb0">Angin musim barat (Des–Feb), umumnya dari barat laut</text>
<path d="M430 520 q10 -26 20 0 q10 26 20 0" stroke="#1f78a8" fill="none" stroke-width="3"/><text x="500" y="530" font-size="12" fill="#1f78a8">▼ hujan intens → limpasan ke zona retensi sisi rendah (asumsi)</text>
${north(940,570)}</svg></div>
<div class="card"><h3>Peluang &amp; Kendala (hipotesis)</h3>
<p><span class="tag">PERLU VERIFIKASI TAPAK</span>Koordinat, kontur, batas lahan, dan vegetasi eksisting belum diterima. Seluruh diagram ini adalah respons iklim generik untuk Makassar.</p>
<ul><li><b>Matahari:</b> sumbu bangunan memanjang timur–barat; bukaan utama menghadap utara–selatan; fasad timur dan barat diberi peneduh dan zona servis.</li><li><b>Angin:</b> dua musim angin berlawanan; bukaan ventilasi silang dibuat dua arah.</li><li><b>Hujan:</b> atap lebar dengan overhang, talang menuju tangki, rain garden, dan bioswale di sisi rendah.</li><li><b>Bising:</b> jalan akses di selatan; zona akademik digeser ke utara, buffer vegetasi di sisi jalan.</li><li><b>Akses:</b> gerbang utama dan drop-off di selatan; gerbang servis terpisah di tenggara.</li></ul>
<div class="lg"><span><i style="background:#e8a317"></i>Lintasan matahari</span><span><i style="background:#1f78a8"></i>Angin musim timur</span><span><i style="background:#58b7e0"></i>Angin musim barat</span><span><i style="background:#d9893b"></i>Fasad panas</span></div></div>`,'grid-template-columns:1.6fr 1fr'));

PAGES.push(()=>sheet(4,'Master Plan Kawasan','Conceptual Master Plan — Not to Scale',`
<div class="card"><svg viewBox="0 0 1000 620"><rect width="1000" height="620" fill="#e6f1e9"/>
<path d="M500 90 C470 200 530 300 500 380 S520 450 500 540" stroke="#58b7e0" stroke-width="26" fill="none" opacity=".6"/>
<text x="520" y="205" font-size="10" fill="#1f78a8">green-blue spine</text>
<rect x="0" y="560" width="1000" height="45" fill="#9aa3ab"/><text x="500" y="588" text-anchor="middle" fill="#fff" font-size="13">Jalan akses</text>
<g stroke="#0b2a4a" stroke-width="2.5" fill="none" stroke-dasharray="3 5"><path d="M500 560 V535"/><path d="M350 540 H650"/><path d="M185 330 V260"/><path d="M185 540 V480"/><path d="M300 405 H410"/><path d="M590 345 H700"/><path d="M590 195 H700"/><path d="M300 185 H410"/><path d="M500 450 V390"/><path d="M500 300 V240"/></g>
<rect x="20" y="545" width="300" height="12" fill="#c9d1d8"/><text x="170" y="544" font-size="10" text-anchor="middle" fill="#17212b">P parkir + drop-off pengunjung</text>
<rect x="330" y="548" width="140" height="10" fill="#f2c14e"/><text x="400" y="545" font-size="9" text-anchor="middle">drop-off siswa</text>
<path d="M880 598 V560" stroke="#e03c31" stroke-width="5"/><text x="880" y="612" text-anchor="middle" font-size="10" fill="#e03c31">gerbang servis</text>
<path d="M500 598 V560" stroke="#0b2a4a" stroke-width="6" marker-end="url(#a2)"/><text x="500" y="612" text-anchor="middle" font-size="10" font-weight="700">GERBANG UTAMA + pos keamanan</text>
<defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0b2a4a"/></marker></defs>
<path d="M880 560 H770 V540" stroke="#e03c31" stroke-width="4" stroke-dasharray="8 4" fill="none"/>
${ZONES.map(zoneSvg).join('')}
<g fill="#2e8b57" opacity=".8"><circle cx="360" cy="210" r="22"/><circle cx="640" cy="230" r="22"/><circle cx="360" cy="270" r="16"/><circle cx="320" cy="470" r="18"/></g>
<text x="360" y="215" text-anchor="middle" font-size="9" fill="#fff">taman</text>
<g><rect x="610" y="520" width="70" height="22" rx="3" fill="#58b7e0" opacity=".7"/><text x="645" y="535" text-anchor="middle" font-size="9">rain garden</text><circle cx="500" cy="420" r="10" fill="#e03c31"/><text x="500" y="424" text-anchor="middle" font-size="8" fill="#fff">E</text></g>
${north(950,40)}</svg>
${legend()}</div>
<div class="card"><h3>Logika Master Plan</h3>
<p><b>Cluster-based planning.</b> SD berada paling dekat gerbang dan administrasi agar mudah diawasi; SMP di sisi barat laut sebagai zona transisi eksplorasi; SMA di timur laut dengan ruang riset dan kolaborasi lebih mandiri.</p>
<p><b>Hub bersama</b> (Perpustakaan, STEAM Hub, Auditorium, Kantin) berada di sumbu tengah sebagai simpul pertemuan antarjenjang, dilalui green-blue spine.</p>
<p><b>Keselamatan.</b> Mobil berhenti di selatan dan tidak masuk ke dalam kawasan. Jalur servis masuk lewat gerbang tenggara menuju zona utilitas, dipisah dari jalur anak.</p>
<p><b>Air.</b> Rain garden dan bioswale mengikuti spine menuju retensi sisi rendah.</p>
<p><span class="tag">ASUMSI KONSEPTUAL</span>Posisi dan jumlah lantai (SD 2 lt, SMP 3 lt, SMA 3 lt) adalah usulan awal. E = titik kumpul evakuasi.</p>

const T=a=>`<table style="width:100%;border-collapse:collapse;font-size:9.5pt"><thead><tr style="background:#0b2a4a;color:#fff;text-align:left"><th style="padding:1.5mm">Zona</th><th>Ruang</th><th>Kapasitas (KAK)</th><th>Penempatan usulan</th></tr></thead><tbody>${a.map(r=>`<tr style="border-bottom:.2mm solid #c5d3dc"><td style="padding:1.5mm">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table>`;
return sheet(29,'Program Ruang (KAK)','Kapasitas mengikuti KAK · penempatan adalah usulan desain',`<div class="card">${T(P.slice(0,17))}</div><div class="card">${T(P.slice(17))}${asm('Program KAK tidak mengikat; peserta boleh menambah atau mengurangi dengan pertimbangan. Luas ruang diverifikasi terhadap regulasi pada tahap lanjut.')}</div>`,'grid-template-columns:1fr 1fr')});

PAGES.push(()=>{const R=[['Bangunan SD (2 lt)',4500,'m²',7.5],['Bangunan SMP (3 lt)',2800,'m²',7.5],['Bangunan SMA (3 lt)',2800,'m²',7.5],['Fasilitas bersama (lab, perpustakaan, serbaguna 2.000 orang, kantin, klinik, admin)',6000,'m²',9],['Indoor sport hall',1400,'m²',6.5],['Perbaikan tanah &amp; pondasi dalam',9000,'m² telapak',1.5],['Lansekap &amp; Eco-Edupark',7000,'m²',.9],['Drainase, retensi, green buffer, jalan',8000,'m²',1.2],['PV surya',487,'kWp',14],['IPAL &amp; pengelolaan limbah lab',1,'paket',4000],['Lift &amp; akses vertikal',6,'unit',600]];
const v=r=>r[1]*r[3]*(r[3]>=100?1e3:1e6)/(r[3]>=100?1:1)/(1);const val=r=>r[3]>=100?r[1]*r[3]*1e6/1e3*1e3/1e3*1e3/1e3:r[1]*r[3]*1e6;
const rows=R.map(r=>[r,r[3]>=100?r[1]*r[3]*1e6:r[1]*r[3]*1e6]);const sub=rows.reduce((s,x)=>s+x[1],0),cont=sub*.1;

<div class="card"><h3>Catatan</h3>${ul(['Harga satuan Makassar 2026 adalah asumsi; sesuaikan dengan HSPK terbaru','Belum termasuk lahan, perizinan, perabot, peralatan lab, dan biaya konsultan','Pondasi dalam diperhitungkan karena kondisi tanah dekat nipah','Pelaksanaan bertahap (3 fase) memungkinkan serapan biaya bertahap','Luas bangunan konsisten dengan asumsi energi pada Lembar 28'])}${asm('Luas lantai per fungsi adalah perkiraan; selaraskan dengan denah Lembar 12–14.')}</div>`,'grid-template-columns:1.8fr 1fr')});

let a2=false;function toggleA2(){a2=!a2;go(cur)}
let cur=0;const deck=$('#deck');deck.innerHTML=PAGES.map(f=>f()).join('');const sheets=[...deck.children];
function fit(){const z=Math.min(1,(innerWidth-250-32)/1587);deck.style.zoom=z}
function go(n){cur=Math.max(0,Math.min(sheets.length-1,n));if(a2)cur-=cur%2;sheets.forEach((s,i)=>s.classList.toggle('active',a2?(i===cur||i===cur+1):i===cur));
 [...document.querySelectorAll('#toc li')].forEach((l,i)=>l.classList.toggle('cur',i===cur));scrollTo(0,0)}
$('#toc').innerHTML=PLANNED.map((t,i)=>i<PAGES.length?`<li><a onclick="go(${i})">${String(i+1).padStart(2,'0')} ${t}</a></li>`:`<li>${String(i+1).padStart(2,'0')} ${t} <small>(menyusul)</small></li>`).join('');
addEventListener('resize',fit);addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
addEventListener('beforeprint',()=>deck.style.zoom=1);addEventListener('afterprint',fit);fit();go(0);fill3dAll();

</script></body></html>
